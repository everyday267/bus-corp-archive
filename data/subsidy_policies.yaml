# =====================================================================
# 지자체별 노선버스 준공영제 시행여부 · 보조금 지급 구조 레지스트리
# ---------------------------------------------------------------------
# - 근거: 국가법령정보센터 자치법규 검색 (2026-10-05 조회)
#         검색어 '준공영제', '공영제', '재정지원 여객자동차'
# - 조례가 있다고 곧바로 '시행 중'은 아니다. status 판단 근거를 evidence 에 남기고,
#   지자체 고시·보도자료로 확인하면 verified: true 로 바꾼다.
# - since(도입연월)는 일반에 알려진 시점을 적어둔 참고값이며 verified 전까지 보고서에 '참고' 표기.
# - params 값이 null 이면 '입력 필요' — 계산기가 누락 항목으로 보고하고 해당 항목을 계산하지 않는다.
#   (실제 단가를 추정해서 채우지 말 것. 지자체 예산서·표준운송원가 용역보고서·국토부 고시에서 확인)
#
# status 값
#   시행       : 준공영제(또는 공공관리제)가 운영 중
#   부분시행   : 일부 노선/업체만 협약 대상 (예: 경기도 공공관리제 협약노선)
#   조례제정   : 조례는 있으나 시행 여부 미확인
#   미시행     : 준공영제 조례 미검색, 개별 재정지원(손실보상) 방식
#   확인필요   : 상충 정보가 있어 사람이 확인해야 함
#
# scope 값 (운영구분명과 매칭) : 시내버스 · 농어촌버스 · 마을버스 · 광역버스 · 노선버스(전체)
# =====================================================================

meta:
  updated: "2026-10-05"
  source: "국가법령정보센터 자치법규 (law.go.kr)"

# ---------------------------------------------------------------------
# 보조금 항목 정의 (계산식은 buscorp/subsidy.py)
# ---------------------------------------------------------------------
components:
  semi_public_deficit:
    name: 준공영제 재정지원(운송수입 부족분)
    basis: "각 지자체 준공영제 조례 (예: 서울특별시 시내버스 준공영제 운영에 관한 조례 제8조·제9조)"
    formula: "max(0, 표준운송원가(원/대·일) × 운행대수 × 운행일수 + 성과이윤 − 운송수입금) × 준공영 대상 비율"
  unprofitable_route_loss:
    name: 비수익노선 손실보상
    basis: "여객자동차 운수사업법 제50조제1항제2호·제2항·제3항, 시·도/시·군·구 재정지원 조례"
    formula: "Σ노선 max(0, 운행원가 − 운송수입) × 보전율"
  remote_route_loss:
    name: 벽지노선 손실보상
    basis: "여객자동차 운수사업법 제50조, 시·도 재정지원 조례(벽지노선 지정·고시)"
    formula: "Σ노선 max(0, 운행원가 − 운송수입) × 보전율"
  transfer_discount_loss:
    name: 환승할인 손실보전
    basis: "지자체 대중교통 환승할인 조례·협약"
    formula: "환승건수 × 건당 손실액 × 보전율"
  fare_discount_loss:
    name: 요금할인·무료 손실보전 (어르신·청소년 등)
    basis: "지자체 요금 지원 조례"
    formula: "할인 이용건수 × 건당 할인액 × 보전율"
  fuel_tax_subsidy:
    name: 유가보조금 (경유 유류세 인상분 / CNG 세금 상당액)
    basis: "여객자동차 운수사업법 제50조제5항·제6항, 같은 법 시행령"
    formula: "연료사용량 × 단가 (경유 원/L, CNG 원/㎥)"
  vehicle_purchase:
    name: 차량 구입 보조 (저상·전기·수소버스)
    basis: "대중교통의 육성 및 이용촉진에 관한 법률, 환경친화적 자동차법, 지자체 보조금 조례"
    formula: "구입대수 × 대당 보조액"

# ---------------------------------------------------------------------
# 전국 공통 파라미터 (지역 params 가 같은 키를 주면 지역 값이 우선)
# ---------------------------------------------------------------------
national_params:
  operating_days: 365            # 연간 운행일수
  fuel_subsidy_per_liter: null   # 경유 유가보조금 단가(원/L) — 국토부 고시 확인
  cng_subsidy_per_m3: null       # CNG 보조 단가(원/㎥) — 지자체 공고 확인
  compensation_rate_unprofitable: null
  compensation_rate_remote: null
  transfer_loss_per_trip: null
  transfer_compensation_rate: null
  fare_discount_compensation_rate: null
  vehicle_subsidy_per_bus: null

# 준공영제 지역 기본 항목 / 비준공영 지역 기본 항목
default_components:
  semi_public: [semi_public_deficit, fuel_tax_subsidy, vehicle_purchase]
  standard: [unprofitable_route_loss, remote_route_loss, transfer_discount_loss,
             fare_discount_loss, fuel_tax_subsidy, vehicle_purchase]

